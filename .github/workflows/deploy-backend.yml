
name: Build and Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohana-backend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mohana-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mohana-backend:${{ github.sha }}

      - name: Deploy backend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu
            cd /home/ubuntu/mohana_pyro_park/backend

            test -f .env || {
              echo "ERROR: Backend .env file is missing"
              exit 1
            }

            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            docker pull "$DOCKERHUB_USERNAME/mohana-backend:latest"

            docker rm -f mohana-backend 2>/dev/null || true

            docker run -d \
              --name mohana-backend \
              --restart unless-stopped \
              --dns 8.8.8.8 \
              --env-file /home/ubuntu/mohana_pyro_park/backend/.env \
              -p 5000:5000 \
              "$DOCKERHUB_USERNAME/mohana-backend:latest"

            sleep 5
            docker ps --filter name=mohana-backend
            docker logs --tail 30 mohana-backend

            if [ "$(docker inspect -f '{{.State.Running}}' mohana-backend)" != "true" ]; then
              echo "ERROR: Backend container is not running"
              exit 1
            fi

            docker logout
