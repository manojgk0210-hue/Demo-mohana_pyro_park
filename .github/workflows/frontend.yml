
name: Build and Deploy Frontend

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mohana-frontend-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mohana-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mohana-frontend:${{ github.sha }}

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu

            echo "$DOCKERHUB_TOKEN" | docker login \
              --username "$DOCKERHUB_USERNAME" \
              --password-stdin

            docker pull "$DOCKERHUB_USERNAME/mohana-frontend:latest"

            docker rm -f mohana-frontend 2>/dev/null || true

            docker run -d \
              --name mohana-frontend \
              --restart unless-stopped \
              -p 80:80 \
              "$DOCKERHUB_USERNAME/mohana-frontend:latest"

            sleep 5
            docker ps --filter name=mohana-frontend
            docker logs --tail 20 mohana-frontend

            if [ "$(docker inspect -f '{{.State.Running}}' mohana-frontend)" != "true" ]; then
              echo "ERROR: Frontend container is not running"
              exit 1
            fi

            docker logout
